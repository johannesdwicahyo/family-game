    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesdwicahyo.Huddle
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.party-games
    scheme:
      testTargets:
        - HuddleTests
        - HuddleUITests
      # Lets the Remove Ads purchase work in the Simulator without App Store Connect.
      storeKitConfiguration: StoreKit/Huddle.storekit
  HuddleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HuddleTests
    dependencies:
      - target: Huddle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesdwicahyo.HuddleTests
        GENERATE_INFOPLIST_FILE: YES
  HuddleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HuddleUITests
    dependencies:
      - target: Huddle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johannesdwicahyo.HuddleUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Huddle
