# Generates Huddle.xcodeproj. Run `xcodegen generate` after changing this file.
name: Huddle
options:
  bundleIdPrefix: com.johannesdwicahyo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
settings:
  base:
    SWIFT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: V8XK2A8P44
    CODE_SIGN_STYLE: Automatic
targets:
  Huddle:
    type: application
    platform: iOS
    sources:
      - path: Huddle
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    info:
      path: Huddle/Info.plist
      properties:
        CFBundleDisplayName: Huddle
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, id]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Display typeface (SIL Open Font License, see Resources/Fonts).
        UIAppFonts: [BricolageGrotesque-ExtraBold.ttf]
        NSUserTrackingUsageDescription: So ads better match your interests. Whatever you choose, the games stay the same.
        # Google's sample app id. Swap for the real AdMob app id before release (see Ads.swift).
        GADApplicationIdentifier: ca-app-pub-2613594201937413~7772540546
        SKAdNetworkItems:
